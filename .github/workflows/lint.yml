name: lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_REQUIRE_TAP_TRUST: "1"

jobs:
  lint:
    name: lint
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
        with:
          persist-credentials: false

      - name: update Homebrew to a stable release
        env:
          HOMEBREW_UPDATE_TO_TAG: "1"
        run: |
          brew update
          major="$(brew --version | sed -n '1s/^Homebrew \([0-9][0-9]*\).*/\1/p')"
          if [[ -z "${major}" || "${major}" -lt 6 ]]; then
            echo "Homebrew 6 or newer is required" >&2
            exit 1
          fi

      - name: setup ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f
        with:
          ruby-version: .ruby-version
          bundler: none
          bundler-cache: false

      - name: bootstrap
        run: script/bootstrap

      - name: lint
        run: script/lint
