name: test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_REQUIRE_TAP_TRUST: "1"

jobs:
  test:
    name: test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          persist-credentials: false

      - name: update Homebrew to a stable release
        env:
          HOMEBREW_UPDATE_TO_TAG: "1"
        run: |
          brew update
          major="$(brew --version | sed -n '1s/^Homebrew \([0-9][0-9]*\).*/\1/p')"
          if [[ -z "${major}" || "${major}" -lt 6 ]]; then
            echo "Homebrew 6 or newer is required" >&2
            exit 1
          fi

      - name: setup ruby
        uses: ruby/setup-ruby@003a5c4d8d6321bd302e38f6f0ec593f77f06600
        with:
          ruby-version: .ruby-version
          bundler: none
          bundler-cache: false

      - name: bootstrap
        run: script/bootstrap

      - name: test
        run: script/test
